name: Aegis CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libssl-dev

      - name: Cache liboqs Build
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: liboqs_src/build
          key: ${{ runner.os }}-liboqs-${{ hashFiles('liboqs_src/**/*.c', 'liboqs_src/**/*.h', 'liboqs_src/CMakeLists.txt') }}

      - name: Build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          cd liboqs_src
          mkdir -p build && cd build
          cmake -GNinja -DOQS_USE_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON ..
          ninja
          sudo ninja install

      - name: Install liboqs (if cached)
        if: steps.cache-liboqs.outputs.cache-hit == 'true'
        run: |
          cd liboqs_src/build
          sudo ninja install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
          pip install -r requirements.txt
          pip install pybind11

      - name: Build Pybind11 Extension
        run: |
          mkdir -p build_pybind && cd build_pybind
          cmake -DPython3_EXECUTABLE=$(which python) ..
          make
          cp aegis_engine*.so ../
          
      - name: Install Project in Editable Mode
        run: pip install -e .

      - name: Run Black
        run: black --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: python -m pytest tests/ -v

      - name: Run Lightweight Benchmark
        run: |
          python run_benchmark.py --algo ML-KEM-512

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: experiments/
