name: Aegis-PQC Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libomp-dev ninja-build

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Build liboqs
      run: |
        cd liboqs_src
        mkdir -p build && cd build
        cmake -GNinja -DOQS_USE_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON ..
        ninja
        sudo ninja install

    - name: Install ONNX Runtime
      run: |
        wget https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz
        tar -zxvf onnxruntime-linux-x64-1.17.1.tgz
        sudo cp -r onnxruntime-linux-x64-1.17.1/include/* /usr/local/include/
        sudo cp -r onnxruntime-linux-x64-1.17.1/lib/* /usr/local/lib/
        sudo ldconfig

    - name: Build Pybind11 Extension
      run: |
        mkdir -p build_pybind && cd build_pybind
        cmake -DPython3_EXECUTABLE=$(which python) ..
        make
        cp aegis_engine*.so ../
          
    - name: Install Project in Editable Mode
      run: pip install -e .

    - name: Run Cross-Validation Pipeline
      run: |
        python phase11_5_pipeline.py

    - name: Run Scalability Benchmark
      run: |
        python scalability_benchmark.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: results_phase11_5/
