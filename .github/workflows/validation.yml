name: Aegis-PQC Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libomp-dev

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Build C++ Native Engine
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_CXX_STANDARD=17 ..
        make -j2

    - name: Run Cross-Validation Pipeline
      run: |
        python phase11_5_pipeline.py

    - name: Run Scalability Benchmark
      run: |
        python scalability_benchmark.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: results_phase11_5/
